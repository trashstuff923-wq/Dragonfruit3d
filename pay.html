<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pay — Dragonfruit 3D</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Space+Mono&display=swap" rel="stylesheet">
<style>
  :root{--primary:#ff0096;--secondary:#9D4EDD;--accent:#00d4ff;--dark:#0a0015;--card:#1a0a2e;--text:#e0e6ed;--dim:#8892a6}
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Space Mono',monospace;background:var(--dark);color:var(--text);min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:16px;
    background-image:linear-gradient(rgba(157,78,221,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(157,78,221,.07) 1px,transparent 1px);
    background-size:32px 32px}
  .box{width:100%;max-width:420px;background:var(--card);border:1px solid var(--primary);border-radius:16px;
    padding:26px 22px;box-shadow:0 0 40px rgba(255,0,150,.25)}
  h1{font-family:Orbitron,sans-serif;font-size:1.35rem;color:var(--primary);letter-spacing:1px;text-align:center}
  .sub{text-align:center;color:var(--dim);font-size:.75rem;margin:6px 0 20px}
  label{display:block;font-size:.72rem;color:var(--accent);margin-bottom:6px;letter-spacing:1px}
  .amtwrap{position:relative;margin-bottom:14px}
  .amtwrap span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:1.9rem;color:var(--dim)}
  #amount{width:100%;padding:14px 14px 14px 42px;font-size:2rem;font-family:Orbitron,sans-serif;
    background:#0d0420;border:2px solid var(--secondary);border-radius:10px;color:#fff;text-align:right}
  #amount:focus{outline:none;border-color:var(--primary);box-shadow:0 0 14px rgba(255,0,150,.4)}
  .quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px}
  .quick button{padding:11px 0;background:transparent;border:1px solid var(--secondary);border-radius:8px;
    color:var(--accent);font-family:'Space Mono',monospace;font-size:.95rem;cursor:pointer;transition:.15s}
  .quick button:hover,.quick button:active{background:var(--secondary);color:#fff}
  #note{width:100%;padding:11px;background:#0d0420;border:1px solid var(--secondary);border-radius:8px;
    color:var(--text);font-family:'Space Mono',monospace;font-size:.85rem;margin-bottom:18px}
  #note:focus{outline:none;border-color:var(--accent)}
  #payBtn{width:100%;padding:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));
    border:none;border-radius:10px;color:#fff;font-family:Orbitron,sans-serif;font-weight:900;
    font-size:1.05rem;letter-spacing:1px;cursor:pointer}
  #payBtn:disabled{opacity:.5;cursor:not-allowed}
  .methods{text-align:center;color:var(--dim);font-size:.7rem;margin-top:12px;line-height:1.7}
  .msg{padding:13px;border-radius:9px;margin-bottom:16px;font-size:.85rem;text-align:center;display:none}
  .ok{background:rgba(0,212,255,.12);border:1px solid var(--accent);color:var(--accent)}
  .err{background:rgba(255,0,150,.12);border:1px solid var(--primary);color:var(--primary)}
  a.back{display:block;text-align:center;margin-top:16px;color:var(--dim);font-size:.72rem;text-decoration:none}
</style>
</head>
<body>
<div class="box">
  <h1>DRAGONFRUIT 3D</h1>
  <div class="sub">// pay at our stall</div>

  <div id="okMsg"  class="msg ok"></div>
  <div id="errMsg" class="msg err"></div>

  <label for="amount">AMOUNT (SGD)</label>
  <div class="amtwrap"><span>$</span><input id="amount" type="number" inputmode="decimal" min="1" max="500" step="0.01" placeholder="0.00"></div>

  <div class="quick">
    <button data-a="2">$2</button><button data-a="5">$5</button>
    <button data-a="6">$6</button><button data-a="8">$8</button>
    <button data-a="10">$10</button><button data-a="11.43">$11.43</button>
    <button data-a="12.86">$12.86</button><button data-a="17.14">$17.14</button>
  </div>

  <label for="note">WHAT DID THEY BUY? (optional)</label>
  <input id="note" type="text" maxlength="60" placeholder="e.g. hexagon fidget + benchy">

  <button id="payBtn">PAY NOW</button>
  <div class="methods">// PayNow · Card · GrabPay<br>secure checkout by Stripe</div>
  <a class="back" href="/">&larr; back to the shop</a>
</div>

<script>
const amountEl=document.getElementById('amount'),noteEl=document.getElementById('note'),
      btn=document.getElementById('payBtn'),okMsg=document.getElementById('okMsg'),errMsg=document.getElementById('errMsg');

// quick-amount buttons fill the field (they match the real product prices)
document.querySelectorAll('.quick button').forEach(b=>{
  b.onclick=()=>{ amountEl.value=b.dataset.a; amountEl.focus(); };
});

// show a result message when Stripe sends the customer back here
const q=new URLSearchParams(location.search);
if(q.get('paid')){
  okMsg.textContent='✅ Paid $'+(q.get('amt')||'')+' — thank you! Hand over the item.';
  okMsg.style.display='block';
  history.replaceState({},document.title,'/pay.html');
}else if(q.get('canceled')){
  errMsg.textContent='Payment canceled — nothing was charged.';
  errMsg.style.display='block';
  history.replaceState({},document.title,'/pay.html');
}

btn.onclick=async()=>{
  errMsg.style.display='none';
  const amount=parseFloat(amountEl.value);
  if(!amount||amount<1||amount>500){
    errMsg.textContent='Enter an amount between $1 and $500.';
    errMsg.style.display='block'; return;
  }
  btn.disabled=true; btn.textContent='STARTING…';
  try{
    const r=await fetch('/.netlify/functions/create-custom-payment',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({amount,note:noteEl.value})
    });
    const d=await r.json();
    if(!r.ok) throw new Error(d.error||'Could not start checkout');
    location.href=d.url;
  }catch(e){
    errMsg.textContent=e.message; errMsg.style.display='block';
    btn.disabled=false; btn.textContent='PAY NOW';
  }
};
amountEl.addEventListener('keydown',e=>{ if(e.key==='Enter') btn.click(); });
</script>
<div style="position:fixed;bottom:6px;right:8px;font-family:'Space Mono',monospace;font-size:10px;color:rgba(255,255,255,0.3)">pay v1</div>
</body>
</html>
